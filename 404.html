<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Abdelrahman Saed</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0d1117" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- Self-contained on purpose: served by GitHub Pages with a real HTTP 404
         for any unknown URL. No bundle assets (their hashes change per deploy)
         and no SPA redirect trick — every legitimate route is prerendered, so
         only genuinely unknown URLs ever land here. -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d1117;
        color: #e8edf2;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        text-align: center;
        padding: 24px;
        border-left: 6px solid #00e5ff;
      }
      .kicker {
        font-family: Menlo, ui-monospace, monospace;
        font-size: 13px;
        letter-spacing: 4px;
        color: #00e5ff;
        text-transform: uppercase;
      }
      h1 {
        font-size: clamp(32px, 6vw, 52px);
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 16px 0 12px;
      }
      p { color: #8b98a5; font-size: 17px; line-height: 1.6; }
      .suggest { margin-top: 14px; color: #e8edf2; font-size: 18px; }
      .suggest a {
        color: #00e5ff;
        text-decoration: underline;
        text-underline-offset: 4px;
        font-family: Menlo, ui-monospace, monospace;
        font-size: 16px;
      }
      .home {
        display: inline-block;
        margin-top: 28px;
        padding: 12px 22px;
        border: 1px solid #00e5ff;
        color: #00e5ff;
        text-decoration: none;
        font-family: Menlo, ui-monospace, monospace;
        font-size: 14px;
        letter-spacing: 1px;
      }
      .home:hover { background: #00e5ff; color: #0d1117; }
      nav {
        margin-top: 40px;
        padding-top: 24px;
        border-top: 1px solid #1e2630;
        display: flex;
        flex-wrap: wrap;
        gap: 12px 28px;
        justify-content: center;
      }
      nav a {
        color: #8b98a5;
        text-decoration: none;
        font-family: Menlo, ui-monospace, monospace;
        font-size: 13px;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      nav a:hover { color: #00e5ff; }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">404 — Not Found</p>
      <h1>This page doesn't exist.</h1>
      <p>The URL may be mistyped, or the page has moved.</p>
      <p class="suggest" id="suggest" hidden>Did you mean <a id="suggest-link" href="/"></a>?</p>
      <a class="home" href="/">← bnsaed.com</a>
      <nav aria-label="Site sections">
        <a href="/articles/">Articles</a>
        <a href="/case-studies/">Case Studies</a>
        <a href="/projects/">Projects</a>
        <a href="/recommendations/">Recommendations</a>
        <a href="mailto:me@bnsaed.com">Email</a>
      </nav>
    </main>
    <!-- Typo helper: GitHub Pages serves this file AT the mistyped URL, so
         location.pathname is the path the visitor typed. The generated
         /sitemap.xml is the canonical route list (no hardcoded routes to
         drift). Mirrors src/components/RouteSuggestion.tsx — keep the two in
         sync. Page works fine without JS; this only reveals a hint. -->
    <script>
      (async function () {
        function lev(a, b) {
          if (!a.length) return b.length;
          if (!b.length) return a.length;
          let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
          for (let i = 1; i <= a.length; i++) {
            const cur = [i];
            for (let j = 1; j <= b.length; j++) {
              cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
            }
            prev = cur;
          }
          return prev[b.length];
        }
        function norm(s) {
          try { s = decodeURIComponent(s); } catch (e) { /* keep raw */ }
          return s.toLowerCase().replace(/\/+$/, "") || "/";
        }
        try {
          const p = norm(location.pathname);
          if (p === "/") return;
          const xml = await fetch("/sitemap.xml").then((r) => (r.ok ? r.text() : ""));
          if (!xml) return;
          const routes = [...xml.matchAll(/<loc>([^<]+)<\/loc>/g)].map((m) => new URL(m[1]).pathname);
          let best = null;
          let bestDist = Infinity;
          for (const route of routes) {
            const c = norm(route);
            if (c === "/" || c === p) continue;
            // Truncated link → 1; slug/hub typo → edit distance; extension of
            // a route → weak 3 so close detail pages beat their hub.
            const d = c.startsWith(p) ? 1 : p.startsWith(c + "/") ? 3 : lev(p, c);
            if (d < bestDist) { bestDist = d; best = route; }
          }
          const threshold = Math.min(6, Math.max(2, Math.floor(p.length * 0.3)));
          if (best && bestDist <= threshold) {
            const link = document.getElementById("suggest-link");
            link.href = best;
            link.textContent = best;
            document.getElementById("suggest").hidden = false;
          }
        } catch (e) { /* hint only — stay silent */ }
      })();
    </script>
  </body>
</html>
